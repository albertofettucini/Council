name: Release

# Push a SemVer tag (e.g. `git tag v1.1.3 && git push origin v1.1.3`) and this builds the app,
# signs the zip for Sparkle, regenerates appcast.xml + commits it back to main (Council serves the
# appcast from the repo's raw URL), and publishes a GitHub Release. No paid Apple cert: the app is
# ad-hoc signed (the project already uses CODE_SIGN_IDENTITY "-"), so it ships UNSIGNED — Gatekeeper
# blocks the first launch and users go System Settings → Privacy & Security → Open Anyway. The only
# secret is the Sparkle EdDSA key (SPARKLE_ED_PRIVATE_KEY); notarization stays a manual local step
# (scripts/notarize.sh) for whenever a paid identity is in play.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner image"
        default: "xcode-27"
        type: choice
        options: ["xcode-27", "macos-26"]
      tag:
        description: "Existing vX.Y.Z tag to rebuild"
        required: false

permissions:
  contents: write          # create the Release AND commit appcast.xml back to main

env:
  SPARKLE_TOOLS_VERSION: "2.10.0"  # must equal the Sparkle version in Package.resolved (pbxproj: upToNextMajor from
                                   # 2.10.0; Package.resolved pins 2.10.0). Bump both together. `sign_update` comes from this tarball

jobs:
  release:
    # xcode-27 = macOS 27 + the Xcode 27 SDK (public-preview label). Compiles the Liquid Glass path
    # (`glassEffect`, macOS 26 SDK+) and leaves room for macOS-27-only APIs later.
    # The app still RUNS on macOS 14+ (guarded by `if #available`). macos-26 stays selectable as a
    # fallback via workflow_dispatch and produces the identical app — nothing is compiled out.
    runs-on: ${{ github.event.inputs.runner || 'xcode-27' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}   # manual rebuild: build the named tag, not the branch
          fetch-depth: 0          # need main as a real ref to commit the appcast back

      - name: Resolve versions
        id: meta
        env:
          # via env, not inline ${{ }}, so a hand-typed dispatch input can't be injected into the script
          INPUT_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$INPUT_TAG"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a vX.Y.Z tag"; exit 1
          fi
          VERSION="${TAG#v}"
          IFS=. read -r MA MI PA <<< "$VERSION"
          # CFBundleVersion = major*10000 + minor*100 + patch — monotonic, and > the old hand-written
          # values (1.1.2 -> 10102 > 112) so existing installs still see the update.
          SPARKLE_VERSION=$(( 10#${MA:-0}*10000 + 10#${MI:-0}*100 + 10#${PA:-0} ))
          echo "version=$VERSION"                 >> "$GITHUB_OUTPUT"
          echo "sparkle_version=$SPARKLE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"                         >> "$GITHUB_OUTPUT"
          echo "Building Council $VERSION (CFBundleVersion $SPARKLE_VERSION)"
          xcodebuild -version || true

      - name: Build Council.app (Release, ad-hoc, universal)
        run: |
          set -euo pipefail
          xcodebuild -project Council.xcodeproj -scheme Council -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/Council.xcarchive \
            MARKETING_VERSION="${{ steps.meta.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.meta.outputs.sparkle_version }}" \
            archive
          APP="build/Council.xcarchive/Products/Applications/Council.app"
          test -d "$APP" || { echo "::error::Council.app not found in the archive"; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "--- version stamp + arch + signature + min OS (hard checks) ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Contents/Info.plist"
          assert_universal() {
            local info; info="$(lipo -info "$1")"; echo "$info"
            case "$info" in *x86_64*) ;; *) echo "::error::$1 is missing x86_64 (Intel users on macOS 14-27 still need it)"; exit 1;; esac
            case "$info" in *arm64*)  ;; *) echo "::error::$1 is missing arm64"; exit 1;; esac
          }
          assert_universal "$APP/Contents/MacOS/Council"
          assert_universal "$APP/Contents/Frameworks/Sparkle.framework/Versions/Current/Sparkle"
          SIGN="$(codesign -dv "$APP" 2>&1)"
          echo "$SIGN" | grep -iE 'Signature|TeamIdentifier' || true
          echo "$SIGN" | grep -q 'Signature=adhoc' \
            || { echo "::error::Council.app is not ad-hoc signed (CODE_SIGN_IDENTITY must stay \"-\")"; exit 1; }
          if echo "$SIGN" | grep 'TeamIdentifier=' | grep -qv 'TeamIdentifier=not set'; then
            echo "::error::Council.app embeds a TeamIdentifier — the shipped build must carry no team"; exit 1
          fi
          MIN_OS="$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist")"
          [ "$MIN_OS" = "14.0" ] || { echo "::error::LSMinimumSystemVersion is '$MIN_OS', expected 14.0"; exit 1; }

      - name: Zip + checksum
        run: |
          set -euo pipefail
          ZIP="Council-${{ steps.meta.outputs.version }}-macOS.zip"
          /usr/bin/ditto -c -k --keepParent "$APP" "$ZIP"
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Fetch Sparkle sign_update
        run: |
          set -euo pipefail
          URL="https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_TOOLS_VERSION}/Sparkle-${SPARKLE_TOOLS_VERSION}.tar.xz"
          curl -fsSL "$URL" -o sparkle.tar.xz
          mkdir -p sparkle && tar -xJf sparkle.tar.xz -C sparkle
          echo "SIGN_UPDATE=$(find "$PWD/sparkle" -name sign_update -type f | head -n1)" >> "$GITHUB_ENV"

      - name: Sign + regenerate appcast, commit to main
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          SPK="${{ steps.meta.outputs.sparkle_version }}"
          TAG="${{ steps.meta.outputs.tag }}"
          ENCLOSURE_URL="https://github.com/albertofettucini/Council/releases/download/${TAG}/${ZIP}"

          if [ -z "${SPARKLE_ED_PRIVATE_KEY:-}" ]; then
            echo "::warning::SPARKLE_ED_PRIVATE_KEY not set — publishing the zip but NOT updating the appcast (existing users won't be offered this update). Add the secret, then re-tag."
            exit 0
          fi

          KEYFILE="$RUNNER_TEMP/sparkle_ed_priv"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$KEYFILE"; chmod 600 "$KEYFILE"
          if "$SIGN_UPDATE" --help 2>&1 | grep -q -- '--ed-key-file'; then
            SIGN_OUT="$("$SIGN_UPDATE" --ed-key-file "$KEYFILE" "$ZIP")"
          else
            SIGN_OUT="$("$SIGN_UPDATE" -f "$KEYFILE" "$ZIP")"
          fi
          rm -f "$KEYFILE"
          echo "sign_update: $SIGN_OUT"
          SIG="$(printf '%s' "$SIGN_OUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')"
          LEN="$(printf '%s' "$SIGN_OUT" | sed -n 's/.*length="\([^"]*\)".*/\1/p')"
          if [ -z "$SIG" ] || [ -z "$LEN" ]; then echo "::error::could not parse sign_update output"; exit 1; fi

          # Update appcast ON main (Council serves it from raw .../main/appcast.xml), then push.
          git config user.name "Joseph"
          git config user.email "joseph.thecouncil@gmail.com"
          git fetch origin main
          git checkout -B main origin/main
          python3 scripts/update-appcast.py \
            --version "$VERSION" --sparkle-version "$SPK" --min-os "14.0" \
            --url "$ENCLOSURE_URL" --signature "$SIG" --length "$LEN" --appcast appcast.xml
          echo "----- appcast.xml -----"; cat appcast.xml
          if git diff --quiet -- appcast.xml; then
            echo "appcast unchanged (re-run of an existing version)"
          else
            git add appcast.xml
            git commit -m "appcast: Council $VERSION"
            git push origin main
          fi

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          NOTES="$(cat <<EOF
          Council ${VERSION} — ask several LLMs one question; they answer in parallel, peer-review each other blind, and you see how much they disagree.

          **Install:** download \`${ZIP}\` below, unzip, drag Council.app to Applications, and open it once. macOS will say it "could not verify" the app (it's unsigned — no paid Apple cert): click Done, then System Settings → Privacy & Security → scroll to Security → **Open Anyway**, and confirm with your password. Do it within the hour — the button goes away after that. It updates itself after that via Sparkle. Want to skip the dance? \`xattr -dr com.apple.quarantine /Applications/Council.app\`, or \`brew install --cask --no-quarantine albertofettucini/council/council\`. On macOS 14, right-click → Open still works.
          EOF
          )"
          ASSETS=("$ZIP" "$ZIP.sha256")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "Council ${VERSION}" --notes "$NOTES"
          fi
